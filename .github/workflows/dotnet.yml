name: .NET Build and Test

on:
  push:
    branches-ignore:
      - main
      - master
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
      - 'global.json'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
      - 'global.json'
      - '.github/workflows/dotnet.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore Taskboard.sln

      - name: Build
        run: dotnet build Taskboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Taskboard.sln --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: '**/TestResults/**/coverage.cobertura.xml'
          fail_ci_if_error: false
